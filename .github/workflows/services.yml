name: services

on:
  pull_request:
    paths: ["services/**", ".github/workflows/services.yml"]
  push:
    branches: [main]
    paths: ["services/**", ".github/workflows/services.yml"]

concurrency:
  group: services-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingest-api: ["services/ingest-api/**", ".github/workflows/services.yml"]
            tracker-worker: ["services/tracker-worker/**", ".github/workflows/services.yml"]

  test:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test with coverage gate
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=85 --junitxml=junit.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.service }}
          path: |
            services/${{ matrix.service }}/junit.xml
            services/${{ matrix.service }}/coverage.xml

  image:
    needs: [changes, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/waybill/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Immutable, traceable tags only: main-<sha> on main, pr-<n>-<sha> on pull requests.
      - name: Compute tag
        id: tag
        run: |
          short="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tag=pr-${{ github.event.number }}-${short}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main-${short}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy.json

      - name: DEBUG locate setuptools
        run: |
          out="$(docker run --rm --user 0 --entrypoint sh "$IMAGE:${{ steps.tag.outputs.tag }}" -c 'grep -rlE "^Version: 70\.3\.0" / --include=METADATA --include=PKG-INFO 2>/dev/null; grep -rl "70.3.0" /usr/local/lib/python3.13 2>/dev/null | head -20' | tr '\n' ' ')"
          echo "::notice title=debug::$out"

      # Surface each finding as an annotation on the run, then gate the push.
      - name: Fail on fixable HIGH/CRITICAL findings
        run: |
          findings="$(jq -r '.Results[]? | .Target as $t | .Vulnerabilities[]? |
            "\(.Severity) \(.VulnerabilityID): \(.PkgName) \(.InstalledVersion) -> \(.FixedVersion) (\(.PkgPath // $t))"' trivy.json | sort -u)"
          if [ -z "$findings" ]; then echo "No fixable HIGH/CRITICAL vulnerabilities."; exit 0; fi
          echo "$findings" | while read -r line; do echo "::error title=Image vulnerability::$line"; done
          exit 1

      - name: Push (main only)
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:${{ steps.tag.outputs.tag }}"
          echo "Pushed \`$IMAGE:${{ steps.tag.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
