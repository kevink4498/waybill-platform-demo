apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ingest-api
  namespace: waybill
spec:
  values:
    image:
      tag: main-0000000
    env:
      GCP_PROJECT_ID: waybill-dev
      SCAN_EVENTS_TOPIC: scan-events
    serviceAccount:
      gcpServiceAccount: ingest-api@waybill-dev.iam.gserviceaccount.com
    vault:
      path: waybill/dev/ingest-api
    route:
      hostname: api.dev.waybill.example.com
    autoscaling:
      minReplicas: 1
      maxReplicas: 2
    pdb:
      enabled: false
