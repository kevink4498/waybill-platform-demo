# Applied once per cluster by `flux bootstrap`; everything else follows from Git.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: waybill-apps
  namespace: flux-system
spec:
  interval: 5m
  path: ./gitops/apps/overlays/prod
  prune: true
  wait: true
  timeout: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
