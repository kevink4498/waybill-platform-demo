apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "microservice.name" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.gcpServiceAccount }}
  annotations:
    iam.gke.io/gcp-service-account: {{ . | quote }}
  {{- end }}
automountServiceAccountToken: {{ ne .Values.serviceAccount.gcpServiceAccount "" }}
