{{- if .Values.route.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "microservice.name" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.route.gatewayName }}
      namespace: {{ .Values.route.gatewayNamespace }}
      sectionName: https
  hostnames:
    - {{ required "route.hostname is required when route.enabled" .Values.route.hostname | quote }}
  rules:
    - backendRefs:
        - {name: {{ include "microservice.name" . }}, port: 80}
{{- end }}
