{{- if .Values.vault.enabled }}
# Synced by the Vault Secrets Operator. Secrets never live in Git or in Helm values.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: {{ include "microservice.name" . }}
  labels: {{- include "microservice.labels" . | nindent 4 }}
spec:
  vaultAuthRef: {{ .Values.vault.authRef }}
  type: kv-v2
  mount: {{ .Values.vault.mount }}
  path: {{ required "vault.path is required when vault.enabled" .Values.vault.path }}
  refreshAfter: {{ .Values.vault.refreshAfter }}
  destination:
    name: {{ include "microservice.name" . }}-vault
    create: true
  rolloutRestartTargets:
    - {kind: Deployment, name: {{ include "microservice.name" . }}}
{{- end }}
