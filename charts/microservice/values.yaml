image:
  repository: ghcr.io/kevink4498/waybill/CHANGEME
  tag: ""          # immutable tag set per environment by the promotion workflow
  pullPolicy: IfNotPresent

replicaCount: 1
containerPort: 8080

env: {}            # non-sensitive settings only; rendered into a ConfigMap

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: 500m, memory: 256Mi}

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false   # turn on once minReplicas >= 2
  minAvailable: 1

serviceAccount:
  # GCP service account to impersonate through GKE Workload Identity (no key files).
  gcpServiceAccount: ""

vault:
  enabled: false
  mount: kv
  path: ""         # e.g. waybill/dev/ingest-api
  authRef: default
  refreshAfter: 60s

route:
  enabled: false
  hostname: ""
  gatewayName: public
  gatewayNamespace: gateway

networkPolicy:
  enabled: true
  ingressFromNamespaces: [gateway]
  egress:
    allowHttps: true   # Google APIs and Vault
    extraCidrs: []

nodeSelector: {}
tolerations: []
